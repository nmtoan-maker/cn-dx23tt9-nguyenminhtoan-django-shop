{% load humanize %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TechShop – Linh kiện máy tính{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --brand:       #2db400;
            --brand-dark:  #1a8f00;
            --brand-light: #e8f9e3;
        }

        /* ===== GLOBAL ===== */
        body {
            background: #f2f4f6;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        /* ===== NAVBAR ===== */
        .navbar {
            background: var(--brand) !important;
            box-shadow: 0 2px 10px rgba(0,0,0,.25);
        }

        .navbar-brand span {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: .5px;
        }

        .btn-cart {
            border: 2px solid rgba(255,255,255,.7);
            color: #fff;
            border-radius: 50px;
            padding: 6px 18px;
            font-weight: 600;
            transition: .2s;
        }

        .btn-cart:hover {
            background: #fff;
            color: var(--brand-dark);
        }

        .cart-badge {
            background: #ff4d4f;
            color: #fff;
            border-radius: 50%;
            font-size: .7rem;
            padding: 2px 6px;
            margin-left: 4px;
            vertical-align: super;
        }

        /* ===== PAGE WRAPPER ===== */
        .page-content {
            width: 100%;
            padding: 32px 24px 60px;
        }

        /* ===== SECTION HEADER ===== */
        .section-header {
            font-size: 1.1rem;
            font-weight: 700;
            color: #333;
            padding-bottom: 8px;
            border-bottom: 3px solid var(--brand);
            margin-bottom: 20px;
            display: inline-block;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>

<!-- ===== NAVBAR ===== -->
<nav class="navbar navbar-dark px-3 px-md-4">
    <a class="navbar-brand d-flex align-items-center gap-2 text-white text-decoration-none" href="/">
        <i class="fa-solid fa-store fs-5"></i>
        <span>TechShop – Linh kiện máy tính</span>
    </a>
    <a href="/cart/" class="btn-cart text-decoration-none d-flex align-items-center gap-2">
        <i class="fa-solid fa-cart-shopping"></i>
        Giỏ hàng
        <span class="cart-badge">{{ cart_count }}</span>
    </a>
</nav>

<!-- ===== CONTENT ===== -->
<div class="page-content">
    {% block content %}{% endblock %}
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

{% block extra_js %}{% endblock %}
</body>
</html>
