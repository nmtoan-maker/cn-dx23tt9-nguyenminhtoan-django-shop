<!DOCTYPE html>
<html>
<head>
    <title>Shop máy tính</title>
    <style>
        body { font-family: Arial; background: #f5f5f5; }
        h1 { text-align: center; }

        .top-bar {
            text-align: center;
            margin-bottom: 20px;
        }

        .top-bar input, .top-bar select {
            padding: 8px;
            margin: 5px;
        }

        .container { width: 90%; margin: auto; }

        .grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .product {
            width: 23%;
            background: white;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 5px #ccc;
        }

        .product img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .price {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

<h1>🛒 Shop linh kiện máy tính</h1>

<div class="top-bar">
    <form method="GET">
        <input type="text" name="q" placeholder="Tìm sản phẩm...">

        <select name="category">
            <option value="">-- Tất cả --</option>
            <option value="laptop">Laptop</option>
            <option value="pc">PC</option>
            <option value="monitor">Màn hình</option>
            <option value="accessory">Phụ kiện</option>
        </select>

        <button type="submit">Lọc</button>
    </form>
</div>

<div class="container">
    <div class="grid">

        {% for product in products %}
        <div class="product">

            <a href="/product/{{ product.id }}/">
                {% if product.image %}
                    <img src="{{ product.image.url }}">
                {% endif %}
                <h3>{{ product.name }}</h3>
            </a>

            <p class="price">{{ product.price }} VND</p>

        </div>
        {% endfor %}

    </div>
</div>

</body>
</html>
